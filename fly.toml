app = "hubrecover"
primary_region = "lhr"

[build]

[env]
  HUBRECOVER_ALLOWED_HOSTS = "hubrecover.fly.dev"
  FORWARDED_ALLOW_IPS = "*"

[mounts]
  source = "hubrecover_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
